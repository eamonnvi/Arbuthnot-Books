title: Arbuthnot Books
description: A small imprint for fiction and ideas.
url: https://arbuthnot-books.com
baseurl: ""
timezone: Europe/London

permalink: /notes/:year/:month/:day/:title/

markdown: kramdown

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  books:
    output: true
    permalink: /books/:name/
  people:
    output: true
    permalink: /people/entries/:name/
  places:
    output: true
    permalink: /places/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      section: notes

# Local editorial material must not be copied into the published site.
exclude:
  - Template
  - README.md
  - editorial
  - eh
  - build_places_from_entities.py
  - debug-places.md
  - Gemfile
  - Gemfile.lock
  - vendor
